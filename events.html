<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events | HCMI</title><link rel="stylesheet" href="style.css"></head><body><script src="nav.js"></script><main class="section"><div class="wrap"><div class="eyebrow">Join Us</div><h2>Upcoming Events</h2><div id="events"></div></div></main><script src="events-data.js"></script><script>document.getElementById('events').innerHTML=events.map(e=>`<article class="event"><div class="date">${e.date}</div><h3>${e.title}</h3><div>${e.venue}</div><div>${e.location}</div><p>${e.repertoire}</p></article>`).join('');</script><script src="footer.js"></script></body></html>
